 function topicLevel(topicId){
  const byId=new Map(topics.filter(topic=>topic&&typeof topic.id==='string').map(topic=>[topic.id,topic]));

  if(!topic)return null;

  while(byId.has(topic.parent_id)&&!seen.has(topic.parent_id)){
   seen.add(topic.parent_id);topic=byId.get(topic.parent_id);level++;

   svg.append(path);
  });
  timeNodes.forEach((n,i)=>{const parents=(Array.isArray(n.parent_ids)?n.parent_ids:[]).map(id=>index.get(id)).filter(j=>Number.isInteger(j)&&j<i);parents.forEach(j=>{const x1=14+lanes[j]*22,x2=14+lanes[i]*22,y1=24+j*48,y2=24+i*48,r=Math.min(12,Math.abs(x2-x1),y2-y1),sign=Math.sign(x2-x1),p=document.createElementNS(ns,'path');p.classList.add('message-relation');p.setAttribute('d',x1===x2?`M${x1} ${y1} V${y2}`:`M${x1} ${y1} V${y2-r} Q${x1} ${y2} ${x1+sign*r} ${y2} H${x2}`);p.setAttribute('fill','none');applyTopicColor(p,n.topic_id);p.setAttribute('stroke','var(--topic-color)');p.setAttribute('stroke-opacity','.85');p.setAttribute('stroke-width','1.5');svg.append(p)})});
  timeNodes.forEach((n,i)=>{const c=document.createElementNS(ns,'circle');c.setAttribute('cx',14+lanes[i]*22);c.setAttribute('cy',24+i*48);c.setAttribute('r','4');applyTopicColor(c,n.topic_id);c.setAttribute('fill','var(--topic-color)');c.setAttribute('data-node-id',n.id);c.setAttribute('aria-pressed',String(n.id===selectedId));const title=document.createElementNS(ns,'title');title.textContent=topicLabels.has(n.topic_id)?`${topicLabels.get(n.topic_id)} · 第 ${Number(c.dataset.topicLevel)+1} 层`:'待归类';c.append(title);c.addEventListener('click',()=>selectNode(n));svg.append(c)});
  const list=document.createElement('div');list.className='time-rows';list.style.gridTemplateRows=`repeat(${timeNodes.length},48px)`;timeNodes.forEach((n,i)=>list.append(timeLeaf(n,i)));layout.append(svg,list);wrap.append(layout);out.append(wrap);
 }
 function drawOutline(){
  const root=document.createElement('details');root.className='outline-group';configureGroup(root,'root');const rootTitle=document.createElement('summary');rootTitle.textContent='Understanding Map';root.append(rootTitle);
  const validTopics=topics.filter(t=>t&&typeof t.id==='string'&&typeof t.label==='string');const byId=new Map(validTopics.map(t=>[t.id,t]));const children=new Map(),items=new Map();
  validTopics.forEach(t=>{const parent=typeof t.parent_id==='string'&&byId.has(t.parent_id)?t.parent_id:null;if(!children.has(parent))children.set(parent,[]);children.get(parent).push(t)});
  let number=0;const turnNumbers=new Map(),unassigned=[];
  nodes.forEach(n=>{if(n.role!=='user')return;if(!turnNumbers.has(n.turn_id))turnNumbers.set(n.turn_id,++number);const entry={node:n,number:turnNumbers.get(n.turn_id)};if(typeof n.topic_id==='string'&&byId.has(n.topic_id)){if(!items.has(n.topic_id))items.set(n.topic_id,[]);items.get(n.topic_id).push(entry)}else unassigned.push(entry)});
  function appendLeaf(container,entry){const row=makeButton(entry.node,'outline-leaf');const num=document.createElement('span');num.className='num';num.textContent=String(entry.number).padStart(2,'0');const label=makeLabel(entry.node);const action=document.createElement('span');action.className='node-action';action.textContent=actionLabel();row.append(num,label,action);container.append(row)}
  const visited=new Set();function appendTopic(topic,container){if(visited.has(topic.id))return;visited.add(topic.id);const group=document.createElement('details');group.className='outline-group';configureGroup(group,`topic:${topic.id}`);const title=document.createElement('summary');title.textContent=topic.label;title.dataset.topicId=topic.id;applyTopicColor(title,topic.id);group.append(title);(items.get(topic.id)||[]).forEach(e=>appendLeaf(group,e));(children.get(topic.id)||[]).forEach(child=>appendTopic(child,group));if(group.children.length>1)container.append(group)}
  (children.get(null)||[]).forEach(topic=>appendTopic(topic,root));validTopics.forEach(topic=>{if(!visited.has(topic.id))appendTopic(topic,root)});
  if(unassigned.length){const group=document.createElement('details');group.className='outline-group';configureGroup(group,'unassigned');const title=document.createElement('summary');title.textContent='待归类';group.append(title);unassigned.forEach(e=>appendLeaf(group,e));root.append(group)}out.append(root);
 }
 function render(){if(selectedId&&!nodes.some(n=>n.id===selectedId&&n.role==='user')){selectedId=null;selectedSource='';sourcePanel.hidden=true;savePrefs()}out.replaceChildren();if(mode==='time'){hint.textContent='顶层靠左、深蓝，子层向右、颜色变浅。虚线表示时间顺序，实线表示已记录的承接';drawTime()}else{hint.textContent='深蓝为顶层，层级越深蓝色越浅，数字表示对话顺序';drawOutline()}}
 function syncMode(){document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.mode===mode)))}
 syncMode();
 document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;syncMode();savePrefs();render()}));
 document.querySelector('#source-close').addEventListener('click',()=>{selectedId=null;selectedSource='';sourcePanel.hidden=true;syncSelection();savePrefs()});
 sourceCopy.addEventListener('click',async()=>{try{if(!selectedSource||!navigator.clipboard)throw Error('unavailable');await navigator.clipboard.writeText(selectedSource.slice(0,60));sourceHelp.textContent='已复制，回到聊天后按 ⌘F 粘贴查找'}catch{sourceHelp.textContent='复制失败，请选中原文手动复制'}});
 async function refresh(){try{const r=await fetch('map-view.json',{cache:'no-store'});if(!r.ok)throw Error('unavailable');const raw=await r.text();if(raw===last)return;const v=JSON.parse(raw);if(!Array.isArray(v.nodes))throw Error('invalid');nodes=v.nodes.filter(n=>n&&typeof n.id==='string'&&typeof n.summary==='string');topics=Array.isArray(v.topics)?v.topics:[];last=raw;hasData=true;status.textContent=`已载入 ${new Set(nodes.filter(n=>n.role==='user').map(n=>n.turn_id)).size} 轮对话 · 打开或刷新时整理新增消息`;render();if(initialRender){initialRender=false;if(restoreSource){restoreSource=false;const selected=nodes.find(n=>n.id===selectedId);if(selected)selectNode(selected,false)}if(restoreScroll>0)requestAnimationFrame(()=>window.scrollTo(0,restoreScroll))}}catch(error){status.textContent=error.code?error.message:(hasData?'地图服务暂不可用，保留上次的内容':'等待本机更新任务生成地图')}}
 function showUpdate(job){
  updateRunning=['checking','summarizing','classifying'].includes(job.status);
  updateButton.disabled=updateRunning;
  const updated=[];
  if(job.added_messages)updated.push(`新增 ${job.added_messages} 条摘要`);
  if(job.classified_messages)updated.push(`补齐 ${job.classified_messages} 条消息标签`);
  const messages={checking:'正在检查新对话…',classifying:`正在补齐 ${job.classified_messages||0} 条消息标签…`,summarizing:`正在整理 ${job.added_messages||0} 条新消息…`,updated:`地图已更新${updated.length?'，'+updated.join('，'):''}`,unchanged:'已检查，暂无新增用户消息'};
  const errors={codex_permission:'无法启动 Codex CLI，请检查运行权限',codex_start_failed:'Codex CLI 启动失败，请确认 codex --version 可用并重启 Codex',codex_missing:'未找到 Codex CLI，请安装或配置本机 Codex',source_unavailable:'无法读取当前聊天，请检查 Codex 本机接口',source_timeout:'读取聊天超时，请重试',source_mismatch:'聊天来源与地图不一致',model_timeout:'摘要任务超时，请检查本机 Codex 的模型连接后重试',model_failed:'摘要任务失败，请检查本机 Codex 认证与模型连接',source_changed:'已保存的消息发生变化，请核对原文后重试',state_changed:'地图被另一任务更新，请再次刷新',invalid_summary:'摘要结果未通过校验，请重试',busy:'另一更新任务正在运行，请稍后重试'};
  updateStatus.textContent=job.status==='error'?(errors[job.error]||'更新未完成，请重试'):messages[job.status]||'';
 }
 async function requestUpdate(){
  if(updateRunning||requestingUpdate)return;
  requestingUpdate=true;activeUpdateId=null;
  showUpdate({status:'checking'});
  try{
   const response=await fetch('refresh',{method:'POST',headers:{'Content-Type':'application/json','X-Understanding-Map-Action':'refresh'},body:'{}'});
   if(!response.ok)throw Error('unavailable');
   const job=await response.json();activeUpdateId=job.id;showUpdate(job);
   if(job.status==='updated'||job.status==='unchanged')await refresh();
  }catch(error){showUpdate({status:'error'});updateStatus.textContent=error.code?error.message:'无法启动更新，请检查本机地图服务后重试'}finally{requestingUpdate=false}
 }
 async function pollUpdate(){
  if(!updateRunning||requestingUpdate)return;
  try{
   const response=await fetch('refresh-status',{cache:'no-store'});
   if(!response.ok)throw Error('unavailable');
   const job=await response.json();
   if(!updateRunning||job.id!==activeUpdateId)return;
   showUpdate(job);
   if(job.status==='updated'||job.status==='unchanged')await refresh();
  }catch(error){showUpdate({status:'error'});updateStatus.textContent=error.code?error.message:'更新状态暂不可用，请检查本机服务后重试'}
 }
 updateButton.addEventListener('click',requestUpdate);
 window.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(savePrefs,250)},{passive:true});
 window.addEventListener('pagehide',savePrefs);
 checkNavigation();refresh();requestUpdate();setInterval(async()=>{await refresh();await pollUpdate()},2500);
})();
</script></body></html>
