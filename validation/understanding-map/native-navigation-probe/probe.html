<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Understanding Map · 原生定位接口实验</title>
<style>
  :root { color-scheme: light dark; font: 15px/1.65 system-ui, sans-serif; }
  body { max-width: 760px; margin: 48px auto; padding: 0 24px; }
  h1 { font-size: 23px; line-height: 1.4; margin-bottom: 12px; }
  h2 { font-size: 18px; }
  p { opacity: .8; }
  button { font: inherit; border: 1px solid #8887; border-radius: 9px; padding: 8px 14px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin: 20px 0; }
  th, td { padding: 9px 0; border-bottom: 1px solid #8884; text-align: left; }
  td:last-child { width: 6em; }
  code { overflow-wrap: anywhere; }
  pre { font: 12px/1.6 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  a { color: inherit; }
</style>
<main>
  <h1>Understanding Map · 原生定位接口实验</h1>
  <p>目标：点击地图节点，让当前 Codex 聊天滚动到对应消息。</p>
  <button id="check" type="button">重新检查面板接口</button>
  <section aria-live="polite" aria-atomic="true">
    <h2 id="status">等待检查</h2>
    <p id="scope"></p>
    <table aria-label="公开接口检查结果">
      <thead><tr><th scope="col">公开接口</th><th scope="col">当前页面</th></tr></thead>
      <tbody id="methods"></tbody>
    </table>
    <p id="outcome">原生定位尚未执行。</p>
  </section>
  <details><summary>检查记录</summary><pre id="report"></pre></details>
  <p>接口依据：<a href="https://developers.openai.com/plugins/reference" target="_blank" rel="noreferrer">OpenAI 官方插件接口文档</a>。</p>
</main>
<script>
(() => {
  'use strict';
  // Inspect only documented compatibility methods. Never invoke them, inspect
  // a parent DOM, send messages, or use a private application transport.
  const documentedMethods = Object.freeze([
    'callTool', 'openExternal', 'sendFollowUpMessage', 'requestDisplayMode',
    'requestModal', 'requestClose', 'setWidgetState', 'setOpenInAppUrl',
    'notifyIntrinsicHeight', 'uploadFile', 'selectFiles', 'getFileDownloadUrl',
  ]);

  function inspectPublicBridge(surface) {
    let bridge;
    try { bridge = surface.openai; }
    catch { return { bridge: 'unreadable', methods: {}, nativeNavigation: 'unverified', navigationAttempted: false }; }
    const present = bridge !== null && (typeof bridge === 'object' || typeof bridge === 'function');
    const methods = {};
    for (const name of documentedMethods) {
      try { methods[name] = present && typeof bridge[name] === 'function' ? 'present' : 'absent'; }
      catch { methods[name] = 'unreadable'; }
    }
    return {
      bridge: present ? 'present' : 'absent',
      methods,
      // A compatibility bridge or an open-link method is not a message locator.
      // There is no documented message-positioning primitive to call here.
      nativeNavigation: 'unverified',
      navigationAttempted: false,
    };
  }

  let checks = 0;
  function run() {
    const result = { check: ++checks, ...inspectPublicBridge(window) };
    document.getElementById('status').textContent = result.bridge === 'present'
      ? '已检测到公开兼容桥；原生定位尚未接通'
      : result.bridge === 'unreadable'
        ? '公开兼容桥无法读取；原生定位尚未验证'
        : '当前页面未检测到公开兼容桥';
    document.getElementById('scope').textContent = '检查范围仅为当前页面的 window.openai。此结果不能代表所有 Codex 扩展入口。';
    const rows = document.getElementById('methods');
    rows.replaceChildren();
    for (const [name, state] of Object.entries(result.methods)) {
      const row = document.createElement('tr');
      const label = document.createElement('td');
      const value = document.createElement('td');
      label.textContent = name;
      value.textContent = { present: '可检测', absent: '未检测到', unreadable: '无法读取' }[state];
      row.append(label, value);
      rows.append(row);
    }
    document.getElementById('outcome').textContent = '原生定位尚未执行。公开文档未列出按消息定位的方法；已有打开链接的接口也不足以确认定位能力。';
    document.getElementById('report').textContent = JSON.stringify(result, null, 2);
    return result;
  }
  window.navigationProbe = Object.freeze({ inspectPublicBridge, run });
  document.getElementById('check').addEventListener('click', run);
  run();
})();
</script>
</html>
